<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RAG Assistant - Login</title>

  <link rel="stylesheet" href="/static/style.css">

  <!-- Apply saved theme before the page is displayed -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem("theme") || "dark";
      document.documentElement.setAttribute("data-theme", savedTheme);
    })();
  </script>
</head>

<body>

  <div class="login-page">

    <div class="login-card">

      <!-- ============================================================
           THEME TOGGLE
           ============================================================ -->

      <button
        type="button"
        id="theme-toggle"
        class="login-theme-toggle"
        aria-label="Switch theme"
        title="Switch theme"
      >
        <!-- Moon icon -->
        <svg
          id="moon-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 12.79A9 9 0 1 1 11.21 3
                   7 7 0 0 0 21 12.79z">
          </path>
        </svg>

        <!-- Sun icon -->
        <svg
          id="sun-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          style="display: none;"
        >
          <circle cx="12" cy="12" r="4"></circle>

          <path d="M12 2v2"></path>
          <path d="M12 20v2"></path>
          <path d="m4.93 4.93 1.41 1.41"></path>
          <path d="m17.66 17.66 1.41 1.41"></path>
          <path d="M2 12h2"></path>
          <path d="M20 12h2"></path>
          <path d="m6.34 17.66-1.41 1.41"></path>
          <path d="m19.07 4.93-1.41 1.41"></path>
        </svg>
      </button>


      <!-- ============================================================
           LOGIN HEADER
           ============================================================ -->

      <div class="login-header">

        <div class="logo">
          RAG
        </div>

        <h1>
          RAG Assistant
        </h1>

        <p>
          Your personal document AI assistant
        </p>

      </div>


      <!-- ============================================================
           ERROR MESSAGE
           ============================================================ -->

      {% if error %}

      <div class="error-message">

        <span>⚠</span>

        <span>
          {{ error }}
        </span>

      </div>

      {% endif %}


      <!-- ============================================================
           LOGIN FORM
           ============================================================ -->

      <form
        action="/login"
        method="post"
        class="login-form"
      >

        <!-- Username -->

        <div class="form-group">

          <label for="username">
            Username
          </label>

          <input
            id="username"
            type="text"
            name="username"
            placeholder="Enter your username"
            autocomplete="username"
            required
            autofocus
          >

        </div>


        <!-- Password -->

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-container">

            <input
              id="password"
              type="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >


            <!-- Password visibility button -->

            <button
              type="button"
              id="toggle-password"
              class="password-toggle"
              aria-label="Show password"
              title="Show password"
            >

              <!-- Eye icon -->

              <svg
                id="eye-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >

                <path
                  d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"
                ></path>

                <circle
                  cx="12"
                  cy="12"
                  r="3"
                ></circle>

              </svg>


              <!-- Eye slash icon -->

              <svg
                id="eye-slash-icon"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                style="display: none;"
              >

                <path d="M3 3l18 18"></path>

                <path
                  d="M10.6 10.6a2 2 0 0 0 2.8 2.8"
                ></path>

                <path
                  d="M9.9 4.2A10.8 10.8 0 0 1 12 4
                     c6.5 0 10 8 10 8
                     a18.5 18.5 0 0 1-3.1 4.4"
                ></path>

                <path
                  d="M6.6 6.6C3.8 8.5 2 12 2 12
                     s3.5 8 10 8
                     c1.5 0 2.9-.4 4.1-1"
                ></path>

              </svg>

            </button>

          </div>

        </div>


        <!-- Login button -->

        <button
          type="submit"
          class="login-button"
        >
          Login / Create account
        </button>

      </form>


      <!-- ============================================================
           LOGIN INFORMATION
           ============================================================ -->

      <div class="login-info">

        <div class="info-icon">
          ℹ
        </div>

        <p>
          If you're a new user, simply enter a new username and password.
          Your account will be created automatically.
        </p>

      </div>


      <!-- ============================================================
           FEATURES
           ============================================================ -->

      <div class="features">

        <div class="feature">

          <span class="feature-icon">
            📄
          </span>

          <span>
            Upload your documents
          </span>

        </div>


        <div class="feature">

          <span class="feature-icon">
            🤖
          </span>

          <span>
            Ask questions using AI
          </span>

        </div>

        <div class="feature">

          <span class="feature-icon">
            🔒
          </span>

          <span>
            Your documents stay private
          </span>

        </div>

      </div>

    </div>

  </div>

  <script src="/static/app.js"></script>

</body>

</html>
