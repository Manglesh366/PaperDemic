<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG Assistant - Login</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>
    (function () {
      var saved = localStorage.getItem("theme") || "dark";
      document.documentElement.setAttribute("data-theme", saved);
    })();
  </script>
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <button type="button" id="theme-toggle" class="login-theme-toggle" aria-label="Switch theme" title="Switch theme">🌙</button>


    <div class="login-header">
      <div class="logo">RAG</div>
      <h1>RAG Assistant</h1>
      <p>Your personal document AI assistant</p>
    </div>

    {% if error %}
    <div class="error-message">
      <span>⚠</span>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form action="/login" method="post" class="login-form">

      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          name="username"
          placeholder="Enter your username"
          autocomplete="username"
          required
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-container">
          <input
            id="password"
            type="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
          <button type="button" id="toggle-password" class="password-toggle">Show</button>
        </div>
      </div>

      <button type="submit" class="login-button">Login / Create account</button>

    </form>

    <div class="login-info">
      <div class="info-icon">ℹ</div>
      <p>
        If you're a new user, simply enter a new username and password.
        Your account will be created automatically.
      </p>
    </div>

    <div class="features">
      <div class="feature">
        <span class="feature-icon">📄</span>
        <span>Upload your documents</span>
      </div>
      <div class="feature">
        <span class="feature-icon">🤖</span>
        <span>Ask questions using AI</span>
      </div>
      <div class="feature">
        <span class="feature-icon">🔒</span>
        <span>Your documents stay private</span>
      </div>
    </div>

  </div>
</div>

<script>
  // Toggle the password field between hidden and visible text.
  const passwordInput = document.getElementById("password");
  const togglePassword = document.getElementById("toggle-password");

  togglePassword.addEventListener("click", () => {
    const isHidden = passwordInput.type === "password";
    passwordInput.type = isHidden ? "text" : "password";
    togglePassword.textContent = isHidden ? "Hide" : "Show";
  });

  // Light / dark theme toggle, persisted in localStorage.
  const themeToggle = document.getElementById("theme-toggle");

  function syncThemeIcon() {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    themeToggle.textContent = isDark ? "🌙" : "☀️";
  }

  themeToggle.addEventListener("click", () => {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    const next = isDark ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
    syncThemeIcon();
  });

  syncThemeIcon();
</script>

</body>
</html>
